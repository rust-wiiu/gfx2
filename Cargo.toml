[package]
name = "gfx2"
version = "0.7.1"
edition = "2024"
readme = "README.md"
license-file = "LICENSE"
description = "Parse Gfx2 shader binaries."
repository = "https://github.com/rust-wiiu/gfx2"
keywords = ["nintendo", "homebrew", "wiiu"]
include = ["Cargo.toml", "Cargo.lock", "LICENSE*", "README*", "src/**/*"]

[features]
default = ["postcard"]
postcard = ["dep:postcard"]

[dependencies]
binrw = { version = "0.15.2", default-features = false }
bitflags = { version = "2.13.1", default-features = false, features = [
    "serde",
] }
serde = { version = "1.0.229", default-features = false, features = [
    "derive",
    "alloc",
] }
serde-big-array = "0.5.1"
thiserror = { version = "2.0.20", default-features = false }
postcard = { version = "1.1.3", features = ["alloc"], optional = true }

[package.metadata.release]
publish = false
push = true
pre-release-hook = ["cargo", "test"]
